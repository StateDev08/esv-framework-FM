# ============================================================
#  ESV Framework – FiveM Hardcore RP Server Configuration
# ============================================================
# Editable Settings
# -----------------
# You can edit the following:

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Server-Informationen ---
sv_licenseKey ""
sv_hostname "ESV Hardcore RP | Dein Server"
load_server_icon Logo.png
sv_projectName "ESV Hardcore RP"
sv_projectDesc "Hardcore Roleplay Server powered by ESV Framework"
sets sv_projectName "ESV Hardcore RP"
sets sv_projectDesc "Hardcore Roleplay Server"
sets locale "de-DE"
sets tags "roleplay, hardcore, deutsch, german, custom"

set resources_useSystemChat true
setr sv_stateBagStrictMode true

# --- Netzwerk ---
sv_maxclients 48
sv_enforceGameBuild 3258
sv_endpointPrivacy true
sv_scriptHookAllowed 0
load_server_icm_purpose 2

# --- MySQL-Verbindung ---
set mysql_connection_string "mysql://root:root@localhost/ESVX?charset=utf8mb4"

add_principal group.admin group.user
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
add_principal identifier.fivem:13326775 group.admin #BladeMaster0815
add_principal identifier.discord:1182659073531985982 group.admin #BladeMaster0815

# --- OneSync ---
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# onesync on
set onesync_population true

# --- Sicherheit ---
sv_authMaxVariance 1
sv_authMinTrust 5

# --- Admin-Berechtigungen ---
add_ace group.admin command allow
add_ace group.admin command.quit allow
add_ace group.admin command.start allow
add_ace group.admin command.stop allow

# --- Dependencies ---
ensure oxmysql
ensure ox_lib

# --- ESV Framework Resources ---
ensure esv_core
ensure esv_notify
ensure esv_multichar
ensure esv_hud
ensure esv_status
ensure esv_inventory
ensure esv_banking
ensure esv_death
