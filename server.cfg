# ============================================================
#  ESV Framework – FiveM Hardcore RP Server Configuration
# ============================================================

# --- Lizenzschlüssel (https://keymaster.fivem.net/) ---
sv_licenseKey "DEIN_LIZENZSCHLUESSEL_HIER"

# --- Server-Informationen ---
sv_hostname "ESV Hardcore RP | Dein Server"
sv_projectName "ESV Hardcore RP"
sv_projectDesc "Hardcore Roleplay Server powered by ESV Framework"
sets sv_projectName "ESV Hardcore RP"
sets sv_projectDesc "Hardcore Roleplay Server"
sets locale "de-DE"
sets tags "roleplay, hardcore, deutsch, german, custom"

# --- Netzwerk ---
sv_maxclients 64
sv_endpointPrivacy true
sv_scriptHookAllowed 0
load_server_icm_purpose 2

# --- Steam Web API Key (optional fuer Steam-Integration) ---
# set steam_webApiKey ""

# --- MySQL-Verbindung (oxmysql) ---
set mysql_connection_string "mysql://root:password@localhost/esv_framework?charset=utf8mb4"

# --- OneSync ---
onesync on
set onesync_population true

# --- Logging ---
sv_authMaxVariance 1
sv_authMinTrust 5

# --- Berechtigungen ---
add_ace group.admin command allow
add_ace group.admin command.quit allow
add_ace group.admin command.start allow
add_ace group.admin command.stop allow
add_principal identifier.license:DEIN_LICENSE admin
add_principal identifier.steam:DEIN_STEAM_HEX admin

# --- Dependencies ---
ensure oxmysql
ensure ox_lib

# --- ESV Framework Resources ---
ensure esv_core
ensure esv_notify
ensure esv_multichar
ensure esv_hud
ensure esv_status
ensure esv_inventory
ensure esv_banking
ensure esv_death
ensure esv_admin
ensure esv_jobs
ensure esv_vehicles
ensure esv_clothing
ensure esv_shops
ensure esv_phone
ensure esv_housing
ensure esv_criminal
ensure esv_dispatch
ensure esv_emotes
ensure esv_scoreboard
ensure esv_loading
