<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESV - Charakter-Auswahl</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="multichar-container" class="hidden">
        <div class="multichar-header">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <span>ESV FRAMEWORK</span>
            </div>
            <h1>CHARAKTER-AUSWAHL</h1>
        </div>

        <div class="char-slots" id="char-slots"></div>

        <!-- Charakter-Erstellung -->
        <div id="create-form" class="hidden">
            <div class="create-panel">
                <h2><i class="fas fa-user-plus"></i> NEUER CHARAKTER</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Vorname</label>
                        <input type="text" id="firstname" placeholder="Max" maxlength="30">
                    </div>
                    <div class="form-group">
                        <label>Nachname</label>
                        <input type="text" id="lastname" placeholder="Mustermann" maxlength="30">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Geburtsdatum</label>
                        <input type="text" id="dateofbirth" placeholder="01.01.2000" maxlength="10">
                    </div>
                    <div class="form-group">
                        <label>Geschlecht</label>
                        <select id="gender">
                            <option value="0">Maennlich</option>
                            <option value="1">Weiblich</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full">
                        <label>Nationalitaet</label>
                        <input type="text" id="nationality" placeholder="Deutschland" maxlength="30" value="Deutschland">
                    </div>
                </div>
                <div class="form-buttons">
                    <button class="btn btn-create" onclick="submitCreate()">
                        <i class="fas fa-check"></i> ERSTELLEN
                    </button>
                    <button class="btn btn-cancel" onclick="cancelCreate()">
                        <i class="fas fa-times"></i> ABBRECHEN
                    </button>
                </div>
            </div>
        </div>

        <!-- Bestaetigung loeschen -->
        <div id="delete-confirm" class="hidden">
            <div class="confirm-panel">
                <h2><i class="fas fa-exclamation-triangle"></i> CHARAKTER LOESCHEN</h2>
                <p>Bist du sicher, dass du diesen Charakter unwiderruflich loeschen moechtest?</p>
                <div class="form-buttons">
                    <button class="btn btn-delete" onclick="confirmDelete()">
                        <i class="fas fa-trash"></i> LOESCHEN
                    </button>
                    <button class="btn btn-cancel" onclick="cancelDelete()">
                        <i class="fas fa-times"></i> ABBRECHEN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
