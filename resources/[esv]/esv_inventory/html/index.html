<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ESV Inventar</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="inventory-container" class="hidden">
        <div class="inventory-panel">
            <div class="inv-header">
                <div class="inv-title">
                    <i class="fas fa-briefcase"></i>
                    <span>INVENTAR</span>
                    <span id="player-name" class="player-name"></span>
                </div>
                <div class="inv-weight">
                    <i class="fas fa-weight-hanging"></i>
                    <span id="weight-display">0 / 50 kg</span>
                </div>
                <button class="close-btn" onclick="closeInventory()"><i class="fas fa-times"></i></button>
            </div>
            <div class="inv-grid" id="inv-grid"></div>
        </div>

        <!-- Item Context Menu -->
        <div id="context-menu" class="hidden">
            <button onclick="useItem()"><i class="fas fa-hand-pointer"></i> Benutzen</button>
            <button onclick="giveItem()"><i class="fas fa-handshake"></i> Geben</button>
            <button onclick="dropItem()"><i class="fas fa-trash"></i> Wegwerfen</button>
        </div>

        <!-- Item Info Tooltip -->
        <div id="item-tooltip" class="hidden">
            <div class="tooltip-name" id="tooltip-name"></div>
            <div class="tooltip-desc" id="tooltip-desc"></div>
            <div class="tooltip-weight" id="tooltip-weight"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
