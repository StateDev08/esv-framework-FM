<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ESV Phone</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="phone-container" class="hidden">
        <div class="phone">
            <div class="phone-header">
                <span class="phone-time" id="phone-time">12:00</span>
                <span class="phone-number" id="phone-number"></span>
            </div>
            <div class="phone-tabs">
                <button class="phone-tab active" onclick="switchPhoneTab('dial', this)"><i class="fas fa-phone"></i></button>
                <button class="phone-tab" onclick="switchPhoneTab('contacts', this)"><i class="fas fa-address-book"></i></button>
                <button class="phone-tab" onclick="switchPhoneTab('messages', this)"><i class="fas fa-comment"></i></button>
                <button class="phone-tab" onclick="switchPhoneTab('emergency', this)"><i class="fas fa-exclamation-triangle"></i></button>
            </div>
            <div class="phone-content">
                <div id="tab-dial" class="phone-page">
                    <input type="text" id="dial-number" placeholder="Nummer eingeben">
                    <div class="numpad">
                        <button onclick="dialBtn('1')">1</button><button onclick="dialBtn('2')">2</button><button onclick="dialBtn('3')">3</button>
                        <button onclick="dialBtn('4')">4</button><button onclick="dialBtn('5')">5</button><button onclick="dialBtn('6')">6</button>
                        <button onclick="dialBtn('7')">7</button><button onclick="dialBtn('8')">8</button><button onclick="dialBtn('9')">9</button>
                        <button onclick="dialBtn('-')">-</button><button onclick="dialBtn('0')">0</button><button onclick="dialClear()"><i class="fas fa-backspace"></i></button>
                    </div>
                    <button class="call-btn" onclick="makeCall()"><i class="fas fa-phone"></i> ANRUFEN</button>
                </div>
                <div id="tab-contacts" class="phone-page hidden">
                    <button class="add-contact-btn" onclick="showAddContact()"><i class="fas fa-plus"></i> Kontakt hinzufuegen</button>
                    <div id="add-contact-form" class="hidden">
                        <input type="text" id="contact-name" placeholder="Name"><input type="text" id="contact-number" placeholder="Nummer">
                        <button onclick="addContact()">Speichern</button>
                    </div>
                    <div id="contacts-list"></div>
                </div>
                <div id="tab-messages" class="phone-page hidden">
                    <div class="msg-compose">
                        <input type="text" id="msg-number" placeholder="Nummer">
                        <input type="text" id="msg-text" placeholder="Nachricht...">
                        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    <div id="messages-list"></div>
                </div>
                <div id="tab-emergency" class="phone-page hidden">
                    <h3 style="color:#e74c3c;text-align:center;margin:10px 0;">NOTRUF</h3>
                    <select id="emergency-type"><option value="police">Polizei (110)</option><option value="ems">Rettungsdienst (112)</option></select>
                    <textarea id="emergency-msg" placeholder="Beschreibe den Notfall..."></textarea>
                    <button class="emergency-btn" onclick="call911()"><i class="fas fa-phone"></i> NOTRUF ABSETZEN</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
